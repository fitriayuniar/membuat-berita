<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portal Berita Fitri - Otomatis & Terbaru</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--muted:#6b7280;--accent:#0b5fff}
html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
body{background:linear-gradient(180deg,#eef2ff 0%,var(--bg) 100%);padding:28px}
.container{max-width:1100px;margin:0 auto}
header{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
header h1{font-size:22px;margin:0;color:var(--accent)}
.controls{display:flex;gap:8px;flex-wrap:wrap}
input[type="text"], select{padding:10px;border-radius:10px;border:1px solid #e6e9ef;min-width:180px}
button{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:10px;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
#news-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:18px}
.card{background:var(--card);border-radius:12px;box-shadow:0 6px 18px rgba(12,34,63,0.07);overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(12,34,63,0.1)}
.thumb{height:160px;object-fit:cover;width:100%;background:#ddd}
.card-body{padding:12px;display:flex;flex-direction:column;flex:1}
.meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.title{font-weight:600;margin:0 0 8px}
.desc{font-size:14px;color:#334155;flex:1}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.source{font-size:13px;color:var(--muted)}
.load-more{display:block;margin:20px auto 0}
.msg{padding:12px;background:#fff;border-radius:10px;box-shadow:0 4px 12px rgba(12,34,63,0.04);text-align:center}
.spinner{border:4px solid rgba(0,0,0,0.06);border-left-color:var(--accent);height:28px;width:28px;border-radius:50%;animation:spin .9s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
footer{margin-top:28px;text-align:center;color:var(--muted);font-size:13px}
@media (max-width:520px){header{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>Portal Berita Fitri 🌏</h1>
<div style="flex:1"></div>
<div class="controls">
<input id="q" type="text" placeholder="Cari berita... (contoh: teknologi, ekonomi)" />
<select id="country" title="Pilih negara">
<option value="">Semua negara</option>
<option value="id">Indonesia</option>
<option value="us">Amerika Serikat</option>
<option value="gb">Inggris</option>
<option value="jp">Jepang</option>
<option value="sg">Singapura</option>
</select>
<select id="category">
<option value="">Semua kategori</option>
<option value="business">Bisnis</option>
<option value="technology">Teknologi</option>
<option value="entertainment">Hiburan</option>
<option value="sports">Olahraga</option>
<option value="health">Kesehatan</option>
<option value="science">Sains</option>
</select>
<button id="searchBtn">Cari</button>
</div>
</header>

<div id="status" class="msg" style="display:none"></div>

<main id="news-grid" aria-live="polite"></main>

<button id="loadMore" class="load-more" style="display:none">Muat lebih banyak</button>

<footer>© 2025 Portal Berita Fitri — powered by NewsAPI.org</footer>
</div>

<script>
const API_KEY = "8d62e1ebe4544270ac56851303a0db37";
const BASE_URL = "https://newsapi.org/v2/top-headlines";

let page = 1;
let currentQuery = "";
let currentCategory = "";
let currentCountry = "";

// fallback images by category
const fallbackImages = {
  business: "https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?w=800",
  technology: "https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=800",
  entertainment: "https://images.unsplash.com/photo-1505238680356-667803448bb6?w=800",
  sports: "https://images.unsplash.com/photo-1517649763962-0c623066013b?w=800",
  health: "https://images.unsplash.com/photo-1510626176961-4b57d4fbad03?w=800",
  science: "https://images.unsplash.com/photo-1559757175-5700dde675bc?w=800",
  default: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800"
};

const statusMsg = document.getElementById("status");
const newsGrid = document.getElementById("news-grid");
const loadMoreBtn = document.getElementById("loadMore");
const searchBtn = document.getElementById("searchBtn");

// === Ambil berita dari API ===
async function fetchNews(loadMore = false) {
  if (!loadMore) {
    page = 1;
    newsGrid.innerHTML = "";
  }

  statusMsg.style.display = "block";
  statusMsg.innerHTML = '<div class="spinner"></div> Memuat berita...';
  loadMoreBtn.style.display = "none";

  const url = new URL(BASE_URL);
  if (currentQuery) url.searchParams.set("q", currentQuery);
  if (currentCategory) url.searchParams.set("category", currentCategory);
  if (currentCountry) url.searchParams.set("country", currentCountry);
  url.searchParams.set("page", page);
  url.searchParams.set("pageSize", 20);
  url.searchParams.set("apiKey", API_KEY);

  try {
    const res = await fetch(url);
    const data = await res.json();

    if (data.articles && data.articles.length > 0) {
      renderNews(data.articles);
      statusMsg.style.display = "none";
      if (data.articles.length >= 20) loadMoreBtn.style.display = "block";
    } else {
      statusMsg.innerHTML = "Tidak ada berita ditemukan 😢 Menampilkan berita lokal.";
      renderNews(localArticles);
    }
  } catch (err) {
    console.error(err);
    statusMsg.innerHTML = "Gagal memuat berita. Menampilkan berita lokal...";
    renderNews(localArticles);
  }
}

// === Render berita ke tampilan ===
function renderNews(articles) {
  for (const a of articles) {
    const imgSrc = a.urlToImage || fallbackImages[currentCategory] || fallbackImages.default;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img class="thumb" src="${imgSrc}" alt="gambar berita" onerror="this.src='${fallbackImages.default}'">
      <div class="card-body">
        <div class="meta">${a.source?.name || "Tanpa sumber"}</div>
        <h3 class="title">${a.title || "Tanpa judul"}</h3>
        <div class="desc">${a.description || "Tidak ada deskripsi tersedia."}</div>
        <div class="actions">
          <span class="source">${new Date(a.publishedAt).toLocaleDateString()}</span>
          <a href="${a.url}" target="_blank" rel="noopener noreferrer">Baca →</a>
        </div>
      </div>
    `;
    newsGrid.appendChild(card);
  }
}

// === Event ===
searchBtn.addEventListener("click", () => {
  currentQuery = document.getElementById("q").value.trim();
  currentCountry = document.getElementById("country").value;
  currentCategory = document.getElementById("category").value;
  fetchNews();
});

loadMoreBtn.addEventListener("click", () => {
  page++;
  fetchNews(true);
});

// === Berita lokal jika API gagal ===
const localArticles = [
  {
    source: { name: 'Sawit Indonesia' },
    title: 'Mentan Siap Dukung Revitalisasi Pabrik Pupuk Nasional',
    description: 'Menteri Pertanian Andi Amran Sulaiman menegaskan komitmen revitalisasi pabrik pupuk mendukung ketahanan pangan nasional.',
    url: 'https://sawitindonesia.com/menteri-pertanian-menindaklanjuti-instruksi-presiden-untuk-revitalisasi-pabrik-pupuk/',
    urlToImage: 'https://sawitindonesia.com/wp-content/uploads/2025/10/menteri-pertanian.jpg',
    publishedAt: '2025-10-17T10:00:00Z'
  },
  {
    source: { name: 'Antara News' },
    title: 'XPeng Buka Diler Flagship di Jakarta Selatan',
    description: 'XPeng resmi membuka diler flagship pertama di Pondok Indah, Jakarta Selatan.',
    url: 'https://www.antaranews.com/berita/5180009/xpeng-indonesia-resmi-hadirkan-diler-flagship-terbaru-di-pondok-indah',
    urlToImage: 'https://www.antaranews.com/images/2025/10/17/xpeng-diler-pondok-indah.jpg',
    publishedAt: '2025-10-17T09:30:00Z'
  },
  {
    source: { name: 'Bola.com' },
    title: 'Thailand Naik Peringkat FIFA, Indonesia Turun',
    description: 'Timnas Thailand menempati posisi ke-96 dalam sistem peringkat FIFA, sementara Indonesia turun peringkat.',
    url: 'https://www.bola.com/indonesia/read/6188290/peringkat-fifa-terbaru-tim-tim-asean-thailand-kembali-ke-100-besar-indonesia-turun',
    urlToImage: 'https://www.bola.com/images/2025/10/17/fifa-asean.jpg',
    publishedAt: '2025-10-17T08:00:00Z'
  }
];

// === Otomatis ambil berita dari beberapa kategori ===
async function autoLoadMultipleCategories() {
  const categories = ["business", "technology", "entertainment", "sports", "health", "science"];
  for (const cat of categories) {
    currentCategory = cat;
    const url = `${BASE_URL}?country=id&category=${cat}&pageSize=5&apiKey=${API_KEY}`;
    try {
      const res = await fetch(url);
      const data = await res.json();
      if (data.articles) renderNews(data.articles);
    } catch (e) {
      console.warn("Gagal ambil kategori:", cat);
    }
  }
  statusMsg.style.display = "none";
}

// === Jalankan otomatis ===
autoLoadMultipleCategories();
</script>
</body>
</html>
